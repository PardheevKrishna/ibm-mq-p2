server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static SPA assets with long cache for hashed bundles
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API proxy to BCL
  location /api/ {
    proxy_pass http://bcl:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /healthz { proxy_pass http://bcl:8080/healthz; }
  location /readyz  { proxy_pass http://bcl:8080/readyz;  }

  # WebSocket proxy
  location /ws {
    proxy_pass http://bcl:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
